name: pages

# Publish the documentation site (website/) to GitHub Pages together with the
# hosted installer, so both of these keep working:
#   https://sujaisubbanna.github.io/utter-assistant/            (docs)
#   curl -fsSL https://sujaisubbanna.github.io/utter-assistant/install.sh | bash
on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # The version comes from the "packageManager" field in website/package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet (idempotent).
          enablement: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Add the hosted installer
        shell: bash
        run: |
          set -euo pipefail
          # Keep install.sh at the site root, unchanged, so the README one-liner
          # (…/utter-assistant/install.sh) keeps resolving exactly as before.
          cp ../install.sh dist/install.sh
          chmod +x dist/install.sh
          cmp ../install.sh dist/install.sh
          echo "--- site ---"
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
