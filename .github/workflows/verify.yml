name: verify

# Full protocol + assistant suite: runner unit/e2e, guardrails, conformance,
# M3 (real assistant as a plugin, dry-run), M5 (assistant CLI) and the spike.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # python-sounddevice imports PortAudio at import time; assistant
        # `recommend` enumerates GPUs through lspci (present on the runner VM).
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 pciutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . numpy sounddevice

      - name: Build the Rust fake plugin
        run: cargo build --release --manifest-path plugins/fake_rs/Cargo.toml

      - name: Verify
        run: UTTER_PY=python3 scripts/verify.sh
