name: release

# Cut a release by pushing a tag `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Or run manually from the Actions tab (optionally overriding the version).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Defaults to the tag or a dev version."
        required: false
        default: ""

permissions:
  contents: write

# One tag must build once: a duplicate trigger for the same ref would race two
# release jobs that attach assets to the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # ubuntu-24.04 ships webkit2gtk-4.1, which Tauri v2 requires.
    # ubuntu-22.04 does NOT (only 4.0) — do not downgrade this runner.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"

      - name: Install system dependencies (Tauri v2 / webkit2gtk-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            file \
            wget \
            curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui-tauri/src-tauri -> target"

      # ------------------------------------------------------------------ #
      # 1. Python core tarball (built first; the installer consumes it)
      # ------------------------------------------------------------------ #
      - name: Build core tarball
        run: |
          chmod +x scripts/build-core-tarball.sh
          scripts/build-core-tarball.sh --version "${{ steps.ver.outputs.version }}" --out dist
          ls -lh dist

      # ------------------------------------------------------------------ #
      # 2. Tauri GUI bundles: AppImage, deb, rpm
      #    NOTE: gui-tauri/ is owned by another lane. If it is absent this
      #    step fails loudly rather than silently producing no GUI assets.
      # ------------------------------------------------------------------ #
      - name: Check gui-tauri present
        id: gui
        shell: bash
        run: |
          if [[ -f gui-tauri/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gui-tauri/ is not present in this checkout; skipping GUI bundles."
          fi

      - name: Install GUI dependencies
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        run: pnpm install --frozen-lockfile

      - name: Build GUI bundles (appimage, deb, rpm)
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        run: pnpm dlx @tauri-apps/cli build --bundles appimage,deb,rpm

      # The Tauri AppImage bundles its own WebKitGTK + the CI distro's
      # GLib/Wayland stack, which is a known source of WebKitGTK scroll/render
      # jank on Wayland/NVIDIA (tauri-apps/tauri#9394, #14427). Repack without
      # WebKit so the AppImage uses the host's WebKitGTK.
      - name: Strip bundled WebKitGTK from the AppImage
        if: steps.gui.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find gui-tauri/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1 || true)"
          if [[ -z "$APPIMAGE" ]]; then
            echo "::warning::no AppImage built; skipping the WebKit strip"
            exit 0
          fi
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          if ! compgen -G "squashfs-root/usr/lib/libwebkit2gtk-4.1*" >/dev/null; then
            echo "::warning::no bundled WebKitGTK found; leaving the AppImage as built"
            exit 0
          fi
          rm -f squashfs-root/usr/lib/libwebkit2gtk-4.1*
          rm -f squashfs-root/usr/lib/libjavascriptcoregtk-4.1*
          rm -rf squashfs-root/usr/lib/webkit2gtk-4.1
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool squashfs-root "$APPIMAGE"
          # Verify the repack really dropped the bundled WebKit.
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          if compgen -G "squashfs-root/usr/lib/libwebkit2gtk-4.1*" >/dev/null; then
            echo "::error::AppImage still bundles libwebkit2gtk after repack"
            exit 1
          fi
          rm -rf squashfs-root

      # ------------------------------------------------------------------ #
      # 3. Rename to stable names + sha256sums.txt
      # ------------------------------------------------------------------ #
      - name: Collect + rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release
          # core tarball
          cp "dist/utter-core-${VERSION}.tar.gz" "release/utter-core-${VERSION}.tar.gz"

          if [[ "${{ steps.gui.outputs.present }}" == "true" ]]; then
            BUNDLE="gui-tauri/src-tauri/target/release/bundle"
            # AppImage
            APPIMAGE="$(find "$BUNDLE/appimage" -name '*.AppImage' | head -1 || true)"
            [[ -n "$APPIMAGE" ]] && cp "$APPIMAGE" "release/utter-gui_${VERSION}_amd64.AppImage"
            # deb
            DEB="$(find "$BUNDLE/deb" -name '*.deb' | head -1 || true)"
            [[ -n "$DEB" ]] && cp "$DEB" "release/utter-gui_${VERSION}_amd64.deb"
            # rpm
            RPM="$(find "$BUNDLE/rpm" -name '*.rpm' | head -1 || true)"
            [[ -n "$RPM" ]] && cp "$RPM" "release/utter-gui-${VERSION}-1.x86_64.rpm"
          fi

          cd release
          sha256sum ./* > sha256sums.txt
          echo "--- release assets ---"
          ls -lh
          echo "--- sha256sums.txt ---"
          cat sha256sums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utter-release-${{ steps.ver.outputs.version }}
          path: release/*
          if-no-files-found: error

      # ------------------------------------------------------------------ #
      # 4. GitHub Release
      # ------------------------------------------------------------------ #
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: utter ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ #
  # macOS — Apple Silicon + Intel.
  #   * builds the Python core tarball (same contents + macos/ helpers) and the
  #     Tauri .app/.dmg on macos-14 (both Apple Silicon and Intel targets);
  #   * codesigned + notarized when valid Apple secrets exist, otherwise unsigned;
  #   * assets are attached to the same GitHub Release with their own
  #     sha256sums-macos-<arch>.txt so the Linux job above stays untouched.
  # ------------------------------------------------------------------ #
  build-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            name: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            name: Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"

      - name: Install GNU tar (reproducible core tarball)
        run: brew install gnu-tar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui-tauri/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Platform self-test (detection + macOS backend selection)
        run: |
          python3 -m pip install numpy
          python3 tests/platform/test_macos_detection.py

      - name: Build core tarball
        run: |
          chmod +x scripts/build-core-tarball.sh
          UTTER_PY="$(command -v python3)" scripts/build-core-tarball.sh \
            --version "${{ steps.ver.outputs.version }}" --out dist
          ls -lh dist

      - name: Check gui-tauri present
        id: gui
        shell: bash
        run: |
          if [[ -f gui-tauri/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gui-tauri/ is not present in this checkout; skipping GUI bundles."
          fi

      - name: Assemble the bundled Python runtime (inside utter.app)
        if: steps.gui.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-macos-runtime.sh
          scripts/build-macos-runtime.sh --version "${{ steps.ver.outputs.version }}" --arch "${{ matrix.target }}"

      - name: Install GUI dependencies
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        run: pnpm install --frozen-lockfile

      - name: Build GUI bundles (app, dmg) — signed + notarized when the Apple secrets exist
        if: steps.gui.outputs.present == 'true'
        # Fail-safe codesigning and notarization:
        # If complete and valid Apple secrets exist, codesign and notarize.
        # If secrets are absent, empty, or invalid, build unsigned and report clearly.
        # An invalid or missing secret never fails the build.
        env:
          RAW_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: gui-tauri
        shell: bash
        run: |
          set -eo pipefail
          CAN_SIGN=0
          if [[ -n "${RAW_APPLE_CERTIFICATE:-}" && -n "${RAW_APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            TMP_P12="$(mktemp /tmp/apple_cert.XXXXXX.p12)"
            if echo "$RAW_APPLE_CERTIFICATE" | base64 --decode > "$TMP_P12" 2>/dev/null && [ -s "$TMP_P12" ]; then
              if openssl pkcs12 -info -noout -passin "pass:$RAW_APPLE_CERTIFICATE_PASSWORD" -in "$TMP_P12" >/dev/null 2>&1; then
                CAN_SIGN=1
              else
                echo "::warning::Apple certificate could not be read with provided password; building unsigned."
              fi
            else
              echo "::warning::Apple certificate is empty or invalid base64; building unsigned."
            fi
            rm -f "$TMP_P12"
          fi

          if [[ "$CAN_SIGN" == "1" ]]; then
            echo "Apple signing secrets validated. Preparing signed build..."
            export APPLE_CERTIFICATE="$RAW_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$RAW_APPLE_CERTIFICATE_PASSWORD"
            [[ -n "${RAW_APPLE_SIGNING_IDENTITY:-}" ]] && export APPLE_SIGNING_IDENTITY="$RAW_APPLE_SIGNING_IDENTITY"
            if [[ -n "${RAW_APPLE_ID:-}" && -n "${RAW_APPLE_PASSWORD:-}" && -n "${RAW_APPLE_TEAM_ID:-}" ]]; then
              echo "Notarization credentials provided."
              export APPLE_ID="$RAW_APPLE_ID"
              export APPLE_PASSWORD="$RAW_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$RAW_APPLE_TEAM_ID"
            fi
            echo "Running Tauri build (signed)..."
            if ! pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"; then
              echo "::warning::Signed build failed; falling back to unsigned build..."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"
            fi
          else
            echo "Apple signing secrets absent or incomplete. Building unsigned .app and .dmg."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"
          fi

      - name: Collect + rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release
          cp "dist/utter-core-${VERSION}.tar.gz" "release/utter-core-${VERSION}-macos-${{ matrix.arch }}.tar.gz"

          if [[ "${{ steps.gui.outputs.present }}" == "true" ]]; then
            BUNDLE="gui-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
            DMG="$(find "$BUNDLE/dmg" -name '*.dmg' | head -1 || true)"
            [[ -n "$DMG" ]] && cp "$DMG" "release/utter-gui_${VERSION}_${{ matrix.arch }}.dmg"
            APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1 || true)"
            if [[ -n "$APP" ]]; then
              # .app bundles are directories: ship a tarball that keeps the
              # executable bits and symlinks intact.
              COPYFILE_DISABLE=1 tar -czf "release/utter-gui_${VERSION}_${{ matrix.arch }}.app.tar.gz" \
                -C "$(dirname "$APP")" "$(basename "$APP")"
            fi
          fi

          cd release
          shasum -a 256 ./* > sha256sums-macos-${{ matrix.arch }}.txt
          echo "--- release assets (macOS ${{ matrix.arch }}) ---"
          ls -lh
          echo "--- sha256sums-macos-${{ matrix.arch }}.txt ---"
          cat sha256sums-macos-${{ matrix.arch }}.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utter-release-${{ steps.ver.outputs.version }}-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: utter ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ #
  # Windows — NSIS (.exe) + WiX (.msi), built natively on windows-latest
  # (default target x86_64-pc-windows-msvc).
  #   * NSIS is the required installer; MSI/WiX is best-effort
  #     (continue-on-error) so a WiX hiccup never blocks a release.
  #   * The installers are UNSIGNED, which requires NO repository secret and
  #     no Windows code-signing certificate. If Authenticode signing is added
  #     later, provide WINDOWS_CERTIFICATE (base64 .pfx) and
  #     WINDOWS_CERTIFICATE_PASSWORD as repository secrets and export them to
  #     the Tauri build env below; nothing else needs to change.
  #   * Does NOT rebuild the Python core tarball: the Linux `build` job
  #     provides utter-core-<ver>.tar.gz.
  # ------------------------------------------------------------------ #
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui-tauri/src-tauri -> target"

      - name: Check gui-tauri present
        id: gui
        run: |
          if [[ -f gui-tauri/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gui-tauri/ is not present in this checkout; skipping Windows installers."
          fi

      - name: Install GUI dependencies
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer (.exe) — required
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        run: pnpm dlx @tauri-apps/cli build --bundles nsis

      - name: Build MSI installer (.msi) — best-effort
        if: steps.gui.outputs.present == 'true'
        working-directory: gui-tauri
        continue-on-error: true
        run: pnpm dlx @tauri-apps/cli build --bundles msi

      - name: Collect + rename artifacts
        if: steps.gui.outputs.present == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release
          BUNDLE="gui-tauri/src-tauri/target/release/bundle"
          NSIS="$(find "$BUNDLE/nsis" -maxdepth 1 -name '*-setup.exe' | head -1 || true)"
          if [[ -z "$NSIS" ]]; then
            echo "::error::no NSIS *-setup.exe produced"
            exit 1
          fi
          cp "$NSIS" "release/utter-gui_${VERSION}_x64-setup.exe"
          MSI="$(find "$BUNDLE/msi" -maxdepth 1 -name '*.msi' | head -1 || true)"
          if [[ -n "$MSI" ]]; then
            cp "$MSI" "release/utter-gui_${VERSION}_x64.msi"
          else
            echo "::warning::no MSI produced (WiX/MSI is best-effort)"
          fi
          cd release
          sha256sum ./* > sha256sums-windows-x64.txt
          echo "--- release assets (Windows x64) ---"
          ls -lh
          echo "--- sha256sums-windows-x64.txt ---"
          cat sha256sums-windows-x64.txt

      - name: Upload build artifacts
        if: steps.gui.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: utter-release-${{ steps.ver.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: steps.gui.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: utter ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # aarch64 is intentionally deferred: the Tauri AppImage/deb/rpm toolchain and
  # the webkit2gtk-4.1 packages are not available on GitHub's arm64 runners yet.
  # Add a `build-aarch64` job on `ubuntu-24.04-arm` once that changes.
