name: macos-dev-build

# Build the macOS settings app (.dmg) and the core tarball from any branch and
# attach them to the workflow run as artifacts — no tag, no GitHub Release.
# Use it to hand a tester a build:
#
#   gh workflow run macos-dev-build.yml --ref <branch>
#   gh run download <run-id>
#
# Signed and notarized if valid Apple secrets are available; otherwise built
# unsigned (Gatekeeper reports unsigned apps as damaged until
# `xattr -cr /Applications/utter.app` is run once).
on:
  workflow_dispatch:
  push:
    branches:
      - feat/macos-support
      - feat/macos-finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            name: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            name: Intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GNU tar
        run: brew install gnu-tar

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui-tauri/src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Platform self-test
        run: |
          python3 -m pip install numpy
          python3 tests/platform/test_macos_detection.py

      - name: Build core tarball
        run: |
          chmod +x scripts/build-core-tarball.sh
          VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)"
          UTTER_PY="$(command -v python3)" scripts/build-core-tarball.sh --version "$VERSION" --out dist
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Assemble the bundled Python runtime (inside utter.app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build-macos-runtime.sh
          scripts/build-macos-runtime.sh --version "${version}" --arch "${{ matrix.target }}"

      - name: Install GUI dependencies
        working-directory: gui-tauri
        run: pnpm install --frozen-lockfile

      - name: Build GUI (app, dmg) — signed + notarized when the Apple secrets exist
        # Fail-safe codesigning and notarization:
        # If complete and valid Apple secrets exist, codesign and notarize.
        # If secrets are absent, empty, or invalid, build unsigned and report clearly.
        # An invalid or missing secret never fails the build.
        env:
          RAW_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: gui-tauri
        shell: bash
        run: |
          set -eo pipefail
          CAN_SIGN=0
          if [[ -n "${RAW_APPLE_CERTIFICATE:-}" && -n "${RAW_APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            TMP_P12="$(mktemp /tmp/apple_cert.XXXXXX.p12)"
            if echo "$RAW_APPLE_CERTIFICATE" | base64 --decode > "$TMP_P12" 2>/dev/null && [ -s "$TMP_P12" ]; then
              if openssl pkcs12 -info -noout -passin "pass:$RAW_APPLE_CERTIFICATE_PASSWORD" -in "$TMP_P12" >/dev/null 2>&1; then
                CAN_SIGN=1
              else
                echo "::warning::Apple certificate could not be read with provided password; building unsigned."
              fi
            else
              echo "::warning::Apple certificate is empty or invalid base64; building unsigned."
            fi
            rm -f "$TMP_P12"
          fi

          if [[ "$CAN_SIGN" == "1" ]]; then
            echo "Apple signing secrets validated. Preparing signed build..."
            export APPLE_CERTIFICATE="$RAW_APPLE_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$RAW_APPLE_CERTIFICATE_PASSWORD"
            [[ -n "${RAW_APPLE_SIGNING_IDENTITY:-}" ]] && export APPLE_SIGNING_IDENTITY="$RAW_APPLE_SIGNING_IDENTITY"
            if [[ -n "${RAW_APPLE_ID:-}" && -n "${RAW_APPLE_PASSWORD:-}" && -n "${RAW_APPLE_TEAM_ID:-}" ]]; then
              echo "Notarization credentials provided."
              export APPLE_ID="$RAW_APPLE_ID"
              export APPLE_PASSWORD="$RAW_APPLE_PASSWORD"
              export APPLE_TEAM_ID="$RAW_APPLE_TEAM_ID"
            fi
            echo "Running Tauri build (signed)..."
            if ! pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"; then
              echo "::warning::Signed build failed; falling back to unsigned build..."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
              pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"
            fi
          else
            echo "Apple signing secrets absent or incomplete. Building unsigned .app and .dmg."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            pnpm dlx @tauri-apps/cli build --bundles app,dmg --target "${{ matrix.target }}"
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/utter-core-*.tar.gz out/
          BUNDLE="gui-tauri/src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -name '*.dmg' | head -1)"
          cp "$DMG" "out/utter-gui_${version}_${{ matrix.arch }}.dmg"
          APP="$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)"
          COPYFILE_DISABLE=1 tar -czf "out/utter-gui_${version}_${{ matrix.arch }}.app.tar.gz" \
            -C "$(dirname "$APP")" "$(basename "$APP")"
          (cd out && shasum -a 256 ./* > sha256sums-macos-${{ matrix.arch }}.txt && ls -lh && cat sha256sums-macos-${{ matrix.arch }}.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utter-macos-${{ matrix.arch }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
