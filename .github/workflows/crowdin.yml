name: crowdin

# Build-time translation sync. Crowdin is NOT a runtime dependency: translators
# work in Crowdin, and finished strings land here as committed locale files.
#
# No-op unless BOTH repository secrets exist:
#   CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN
# Without them this workflow exits 0 without touching anything, so forks and
# the default repo never fail. See docs/TRANSLATING.md.
on:
  push:
    branches: [main]
    paths:
      - "gui-tauri/src/i18n/en.ts"
      - "install/i18n/en.sh"
      - ".crowdin.yml"
      - ".github/workflows/crowdin.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for Crowdin credentials
        id: guard
        shell: bash
        run: |
          if [[ -n "${{ secrets.CROWDIN_PROJECT_ID }}" && -n "${{ secrets.CROWDIN_PERSONAL_TOKEN }}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Crowdin secrets are not set; skipping the sync (this is expected on forks)."
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Upload English sources to Crowdin
        if: steps.guard.outputs.configured == 'true'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download translations into a pull request
        if: steps.guard.outputs.configured == 'true'
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          download_translations: true
          create_pull_request: true
          localization_branch_name: chore/crowdin-translations
          pull_request_title: "chore(i18n): update translations from Crowdin"
          pull_request_body: "Automated Crowdin translation sync. Review before merging; machine drafts still need a fluent speaker."
          pull_request_base_branch_name: main
          commit_message: "chore(i18n): update translations from Crowdin"
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
