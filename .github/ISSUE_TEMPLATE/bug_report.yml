name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        Before you continue, please **search [existing issues](https://github.com/sujaisubbanna/utter-assistant/issues)**
        to avoid a duplicate. One bug per issue, please. For security problems, use
        [SECURITY.md](https://github.com/sujaisubbanna/utter-assistant/blob/main/SECURITY.md) instead —
        **never a public issue**.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest numbered sequence that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Utter version and how it was installed
      description: The version, and how you installed it (installer, source checkout, release bundle).
      placeholder: "e.g. 0.1.0 — installed via ./install.sh"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      description: Your operating system and version.
      placeholder: "e.g. Linux Wayland / niri, or macOS 15 on Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste logs and errors as **text** (in a code block), not screenshots of text.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or animation
      description: Drag images or a short animation here for anything visual or UI-related.
    validations:
      required: false
  - type: checkboxes
    id: latest
    attributes:
      label: Latest release
      options:
        - label: I have confirmed this reproduces on the latest release.
          required: false
