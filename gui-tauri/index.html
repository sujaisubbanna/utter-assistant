<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Utter</title>
    <script>
      // Set the theme class before first paint so there is no flash of the
      // wrong palette. Kept dependency-free and in sync with src/lib/theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem("utter.theme") || "dark";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var el = document.documentElement;
          el.classList.toggle("dark", dark);
          el.dataset.themeMode = mode;
          el.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      /* Splash: painted before any JS so the window never opens blank. The two
         halves of the mark swoop together, then the word arrives letter by
         letter. Removed by src/App.tsx once settings have loaded. */
      #splash {
        --s-bg: #f3f3f1; --s-ink: #1a1a1a; --s-mut: #6b6b6b; --s-acc: #e6b41e; --s-ok: #20a05a;
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(60% 50% at 50% 44%, color-mix(in oklab, var(--s-acc) 12%, var(--s-bg)), var(--s-bg));
        font-family: "Inter Variable", Inter, system-ui, sans-serif;
        transition: opacity 400ms cubic-bezier(.4,0,.2,1), transform 400ms cubic-bezier(.4,0,.2,1);
        -webkit-user-select: none; user-select: none;
      }
      html.dark #splash { --s-bg: #121212; --s-ink: #ececec; --s-mut: #9c9c9c; --s-acc: #f7c948; --s-ok: #4cc38a; }
      #splash.out { opacity: 0; transform: scale(1.015); pointer-events: none; }
      #splash .lockup { width: 380px; height: auto; overflow: visible; }
      #splash .half, #splash .glyph { transform-box: fill-box; transform-origin: center; opacity: 0; }
      #splash .half-l { fill: var(--s-acc); animation: s-left 620ms 60ms cubic-bezier(.18,1.25,.35,1) forwards; }
      #splash .half-r { fill: var(--s-acc); filter: brightness(.82); animation: s-right 620ms 190ms cubic-bezier(.18,1.25,.35,1) forwards; }
      html.dark #splash .half-r { filter: brightness(.9); }
      #splash .glyph { fill: var(--s-ink); animation: s-letter 420ms cubic-bezier(.2,.9,.25,1) forwards; }
      #splash .g1 { animation-delay: 560ms; } #splash .g2 { animation-delay: 615ms; } #splash .g3 { animation-delay: 670ms; }
      #splash .g4 { animation-delay: 725ms; } #splash .g5 { animation-delay: 780ms; }
      #splash .promise { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--s-mut); opacity: 0; animation: s-fade 420ms 960ms cubic-bezier(.2,.8,.2,1) forwards; }
      #splash .promise svg { width: 14px; height: 14px; color: var(--s-ok); }
      #splash .track { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: color-mix(in oklab, var(--s-ink) 9%, transparent); opacity: 0; animation: s-fade 300ms 1100ms forwards; }
      #splash .track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--s-acc); animation: s-slide 1.1s ease-in-out infinite; }
      @keyframes s-left { from { opacity: 0; transform: translate(-34px, -10px) rotate(-14deg) scale(.9); } to { opacity: 1; transform: none; } }
      @keyframes s-right { from { opacity: 0; transform: translate(34px, 14px) rotate(16deg) scale(.9); } to { opacity: 1; transform: none; } }
      @keyframes s-letter { from { opacity: 0; transform: translateY(16px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes s-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes s-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; transition: none !important; }
        #splash .half, #splash .glyph, #splash .promise, #splash .track { opacity: 1; }
      }
    </style>
  </head>
  <body>

        </g>
      </svg>
      <div class="promise">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 19.5 6v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z" /><path d="m9 12 2.2 2.2L15.5 10" /></svg>
        <span id="splash-promise">Private by design · runs entirely on your computer</span>
      </div>
      <div class="track" aria-hidden="true"><i></i></div>
    </div>
    <script>
      // Localise the one splash line before React (and its i18n) loads.
      (function () {
        try {
          var pref = localStorage.getItem("utter.lang") || "system";
          var lang = pref === "system" ? (navigator.language || "en").slice(0, 2) : pref;
          if (lang === "es")
            document.getElementById("splash-promise").textContent =
              "Privado por diseño · funciona por completo en tu ordenador";
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
