id: google-chrome
name: Google Chrome
aliases: [chrome, google chrome, google-chrome, google, chromium]
launch: [google-chrome-stable]
terminal: false
new_window: [google-chrome-stable, --new-window]
search_url: "https://www.google.com/search?q={q}"
shortcuts:
  new_tab: ctrl+t
  close_tab: ctrl+w
  address_bar: ctrl+l
  reload: ctrl+r
  find: ctrl+f
  back: alt+left
  forward: alt+right
  reopen_tab: ctrl+shift+t
  new_window: ctrl+n
  private_window: ctrl+shift+n
  history: ctrl+h
  downloads: ctrl+j
app_ids: [google-chrome, Google-chrome, chrome]
mime_types:
  - x-scheme-handler/http
  - x-scheme-handler/https
  - text/html
  - application/pdf
kind: browser
