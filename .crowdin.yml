# Crowdin configuration — build-time localization only.
#
# Crowdin does NOT parse our TypeScript/Shell locale modules, so the sources it
# sees are the plain JSON exports in `crowdin/`:
#
#     scripts/i18n_crowdin.py export   # en.ts + install/i18n/*.sh -> crowdin/*.json
#     scripts/i18n_crowdin.py import   # crowdin/*-<lang>.json -> <lang>.ts / <lang>.sh
#
# Translators work in Crowdin; finished strings come back as PRs (see
# .github/workflows/crowdin.yml), then `import` rewrites the real locale files.
# Crowdin is never a runtime dependency and is never contacted by the app.
#
# Maintainer setup: set the secrets CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN.
# Without them the sync workflow is a no-op.

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  # Settings-app UI strings (flat dotted keys: "app.name", "language.system").
  - source: /crowdin/ui-en.json
    translation: /crowdin/ui-%two_letters_code%.json
    type: json
    languages_mapping:
      two_letters_code:
        zh-CN: zh
        zh-TW: zh
        pt-BR: pt
        pt-PT: pt

  # Installer strings (key = exact English message, value = translation).
  - source: /crowdin/installer-en.json
    translation: /crowdin/installer-%two_letters_code%.json
    type: json
    languages_mapping:
      two_letters_code:
        zh-CN: zh
        zh-TW: zh
        pt-BR: pt
        pt-PT: pt
