[project]
name = "utter"
version = "0.1.4"
description = "Context-aware, local, always-on voice->desktop-action sidecar. Rules first, vision last."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
agent = [
    "evdev>=1.7",
    "numpy>=1.26",
]
inference = [
    "vllm>=0.10",
]
# macOS voice + desktop glue (see docs/MACOS.md). Linux installs never need these.
macos = [
    "numpy>=1.26",
    "sounddevice>=0.4",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Speech>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pywhispercpp>=1.2",
]

[project.scripts]
utter = "utter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `utter` is the legacy assistant; `assistant`/`runner` are the modular entry
# points (`python -m assistant`, `python -m runner`); `plugins` is a namespace
# package holding the bundled plugins. Exclude the Rust fake's Cargo sources
# and build output, which are not Python packages.
include = ["utter*", "assistant*", "runner*", "plugins*"]
exclude = ["plugins.fake_rs.src*", "plugins.fake_rs.target*"]
namespaces = true

[tool.setuptools.package-data]
utter = ["profiles/*.yaml", "data/*.json"]
